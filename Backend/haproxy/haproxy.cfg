global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global

    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-request 5s

frontend main
    bind *:80

    monitor-uri /health

    # --- Realtime / WebSocket traffic -> realtime ---
    acl is_realtime_path path_beg /socket.io /realtime
    acl is_websocket_upgrade hdr(Upgrade) -i websocket
    use_backend chat_realtime if is_realtime_path or is_websocket_upgrade

    # --- HTTP API traffic -> api ---
    acl is_api_pf path_beg /api
    acl is_api_auth path_beg /auth
    acl is_api_users path_beg /users
    acl is_api_conversations path_beg /conversations
    acl is_api_messages path_beg /messages
    acl is_api_contacts path_beg /contacts
    acl is_api_members path_beg /conversation-members
    use_backend chat_api if is_api_pf or is_api_auth or is_api_users or is_api_conversations or is_api_messages or is_api_contacts or is_api_members

    # --- Any unknown path -> api:3003 (404 from Nest if no route) ---
    default_backend chat_api

backend chat_api
    balance roundrobin

    # Strip the /api prefix so api:3003 receives its native routes (/users, /auth, ...)
    http-request set-path %[path,regsub(^/api,)] if { path_beg /api }

    server chat_api api:3003 check

backend chat_realtime
    # Long-polling (HTTP) + WebSocket upgrade to the NestJS realtime service
    timeout connect 5s
    timeout server  30s
    timeout tunnel 1h

    server chat_realtime realtime:3002 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats show-legends
    stats show-node

